name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Advisory while the pre-existing backlog (unused vars, explicit `any`) is
    # paid down: the job still reports its findings, but a red lint run no
    # longer blocks typecheck, test and build from giving a real signal.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: No stray or temporary files tracked
        run: pnpm check:stray

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    # The suites import modules that read the validated config at load time, so
    # CI needs the same keys a local `.env` provides. Values are throwaway.
    env:
      NODE_ENV: test
      DISCORD_CLIENT_ID: '000000000000000000'
      DISCORD_CLIENT_SECRET: test-client-secret
      DISCORD_TOKEN: test-token
      DISCORD_OWNER_ID: '000000000000000000'
      DISCORD_PUBLIC_KEY: test-public-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pinguin_test
      SESSION_SECRET: test-session-secret-0123456789abcdef
      API_URL: http://localhost:4000
      BOT_INTERNAL_SECRET: test-bot-internal-secret-0123456789ab
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_DISCORD_CLIENT_ID: '000000000000000000'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      OWNER_PASSWORD: test-owner-password
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The unit suites mock Prisma, so no database service is required. The
      # incremental migrations only ALTER tables that `prisma/baseline` creates,
      # so replaying them on an empty database cannot work: validate the schema
      # instead of pretending to migrate.
      - name: Validate Prisma schema
        run: pnpm --filter @pinguin/db exec prisma validate
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Run tests
        run: pnpm test

  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build
        run: pnpm build
