# /etc/nginx/sites-available/pinguinboat
# Rename to the real domain (PINGUIN_DOMAIN) and link into sites-enabled.

upstream pinguin-web {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream pinguin-api {
    server 127.0.0.1:4000;
    keepalive 64;
}

# Per-surface rate-limit zones: auth callbacks and owner actions need a much
# tighter budget than ordinary dashboard reads.
limit_req_zone $binary_remote_addr zone=pinguin_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pinguin_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=pinguin_owner:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=pinguin_conn:10m;

server {
    listen 80;
    server_name votredomaine.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name votredomaine.com;

    ssl_certificate /etc/letsencrypt/live/votredomaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votredomaine.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Brotli (module: libnginx-mod-http-brotli) with gzip as fallback.
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    server_tokens off;

    # Request body and proxy timeouts
    client_max_body_size 2m;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Connection limits per IP
    limit_conn pinguin_conn 20;

    # Root
    root /opt/pinguinboat/current/apps/web/public;

    # Web app
    location / {
        proxy_pass http://pinguin-web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    # Auth callbacks: brute-force surface, tightest budget.
    location /api/auth/ {
        limit_req zone=pinguin_auth burst=10 nodelay;
        proxy_pass http://pinguin-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Owner / deploy endpoints: destructive actions, very tight budget.
    location /api/owner/ {
        limit_req zone=pinguin_owner burst=5 nodelay;
        proxy_pass http://pinguin-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        limit_req zone=pinguin_api burst=20 nodelay;
        proxy_pass http://pinguin-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Server-sent events: never buffer, never time out early.
    location /api/events {
        limit_req zone=pinguin_api burst=20 nodelay;
        proxy_pass http://pinguin-api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    # WebSocket for music
    location /api/music/ws {
        proxy_pass http://pinguin-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Static assets caching
    location /_next/static {
        proxy_pass http://pinguin-web;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /static {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}